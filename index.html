<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Café da Manhã de Aniversário – Giuseppe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonte gamer -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #12153a;
      --cardTop: #2a2f6a;
      --cardBottom: #14173a;
      --yellow: #f5e642;
      --cyan: #57e6ff;
      --pink: #ff5fa2;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Press Start 2P', monospace;
      background: linear-gradient(180deg, #1b1f4b, var(--bg));
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      position: relative;
      max-width: 420px;
      width: 100%;
      background: radial-gradient(circle at top, var(--cardTop), var(--cardBottom));
      border: 4px solid var(--yellow);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      animation: float 8s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    .sound-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--cyan);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 8px;
      cursor: pointer;
    }

    .label {
      color: var(--yellow);
      font-size: 10px;
      margin-top: 16px;
    }

    .value {
      font-size: 14px;
      margin-top: 6px;
    }

    h1 {
      color: var(--yellow);
      font-size: 18px;
      margin: 24px 0;
      line-height: 1.4;
    }

    .highlight {
      color: var(--cyan);
    }

    iframe {
      margin-top: 16px;
      width: 100%;
      height: 180px;
      border-radius: 8px;
      border: 2px solid var(--cyan);
    }

    .footer {
      font-size: 9px;
      margin-top: 16px;
      line-height: 1.6;
    }

    .rsvp {
      margin-top: 16px;
      padding: 12px;
      border: 2px dashed var(--pink);
      border-radius: 10px;
      color: var(--pink);
      font-size: 10px;
    }

    form {
      margin-top: 16px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      font-family: inherit;
      font-size: 9px;
      border-radius: 6px;
      border: none;
    }

    button.submit {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      background: var(--yellow);
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
    }

    button.submit:hover {
      filter: brightness(1.1);
    }
  </style>
</head>

<body>

  <!-- ÁUDIO LOCAL (FUNCIONA EM TODOS OS NAVEGADORES) -->
  <audio id="bgm" preload="auto" playsinline>
    <source src="assets/bgm.mp3" type="audio/mpeg">
  </audio>

  <div class="card">
    <button class="sound-btn" id="soundBtn">▶ SOM</button>

    <div class="label">JOGADOR</div>
    <div class="value">GIUSEPPE</div>

    <div class="label">SUBINDO DE NÍVEL PARA</div>
    <div class="value highlight">+34 ★</div>

    <h1>CAFÉ DA MANHÃ<br>DE ANIVERSÁRIO</h1>

    <div class="label">DATA</div>
    <div class="value">DOMINGO • 18 DE JANEIRO</div>

    <div class="label">HORÁRIO</div>
    <div class="value">8H ÀS 11H30</div>

    <div class="label">LOCAL</div>
    <div class="value">SÍTIO TANGARÁ • PRATA</div>

    <iframe
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      src="https://www.google.com/maps?q=S%C3%ADtio+Tangar%C3%A1+Teres%C3%B3polis+RJ&output=embed">
    </iframe>

    <div class="footer">
      Será uma alegria receber você<br>
      para celebrar este momento.
    </div>

    <div class="rsvp">CONFIRMAÇÃO DE PRESENÇA</div>

    <form id="rsvpForm">
      <input type="text" id="nome" placeholder="SEU NOME" required>
      <select id="presenca" required>
        <option value="">VAI COMPARECER?</option>
        <option value="Confirmo presença">Confirmo presença</option>
        <option value="Não poderei comparecer">Não poderei comparecer</option>
      </select>
      <button type="submit" class="submit">ENVIAR CONFIRMAÇÃO</button>
    </form>
  </div>

  <script>
    const audio = document.getElementById('bgm');
    const soundBtn = document.getElementById('soundBtn');
    let tocando = false;

    soundBtn.addEventListener('click', () => {
      if (!tocando) {
        audio.volume = 0.4;
        audio.loop = true;
        audio.play();
        soundBtn.textContent = '⏸ SOM';
        tocando = true;
      } else {
        audio.pause();
        soundBtn.textContent = '▶ SOM';
        tocando = false;
      }
    });

    document.getElementById('rsvpForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const nome = document.getElementById('nome').value;
      const presenca = document.getElementById('presenca').value;

      const numero = '(21)98196-7724'; // ex: 5521999999999
      const msg = `Olá! ${nome} aqui 😊 ${presenca} no seu café da manhã de aniversário!`;

      window.open(
        `https://wa.me/${numero}?text=${encodeURIComponent(msg)}`,
        '_blank'
      );
    });
  </script>

</body>
</html>


</body>
</html>
